$kind: http-request
url: "{{baseUrl}}/api/admin/lecturers"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"admin@uov.com\",\r

    \    \"password\": \"AdU123$%\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
