$kind: http-request
url: "{{baseUrl}}/api/auth/change-password"
method: PUT
body:
  type: json
  content: "{\r

    \    \"currentPassword\":\"NimWic45\",\r

    \    \"newPassword\":\"NimWic45sha50\",\r

    \    \"confirmPassword\":\"NimWic45sha50\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: "// 1. Status Code එක 204 No Content ද බලනවා\r

      pm.test(\"Status code is 204 No Content\", function () {\r

      \    pm.response.to.have.status(204);\r

      });\r

      \r

      // 2. Response Body එක හිස් ද බලනවා (මොකද 204 එකේදි body එකක් එන්නේ නෑ)\r

      pm.test(\"Response body should be empty\", function () {\r

      \    pm.expect(pm.response.text()).to.be.empty;\r

      });"
    language: text/javascript
order: 5000
